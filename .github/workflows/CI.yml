name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --group test
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  surrogate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore surrogate data cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: surrogate-data
          key: surrogate-data-${{ hashFiles('.github/surrogate-data.md5') }}
          restore-keys: surrogate-data-
      - name: Verify restored surrogate data
        id: verify
        continue-on-error: true
        run: |
          cd surrogate-data
          md5sum --check --quiet "$GITHUB_WORKSPACE/.github/surrogate-data.md5"
      - name: Download surrogate data from Zenodo
        if: steps.verify.outcome != 'success'
        run: |
          mkdir -p surrogate-data
          cd surrogate-data
          while read -r _ name; do
            curl --fail --silent --show-error --location \
              --retry 10 --retry-all-errors --retry-delay 30 --retry-max-time 3600 \
              --connect-timeout 30 --speed-limit 1000 --speed-time 120 --max-time 1800 \
              --output "$name.part" \
              "https://zenodo.org/records/3348115/files/$name?download=1"
            mv "$name.part" "$name"
          done < "$GITHUB_WORKSPACE/.github/surrogate-data.md5"
          md5sum --check "$GITHUB_WORKSPACE/.github/surrogate-data.md5"
      - name: Save surrogate data cache
        if: steps.verify.outcome != 'success'
        uses: actions/cache/save@v6
        with:
          path: surrogate-data
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload surrogate data artifact
        uses: actions/upload-artifact@v6
        with:
          name: surrogate-data
          path: surrogate-data/*.h5
          if-no-files-found: error
          retention-days: 7

  test:
    needs: [surrogate-data]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GSL
        if: matrix.python-version == '3.13'
        run: sudo apt-get install -y libgsl-dev
      - name: Install dependencies
        run: uv sync --group test ${{ matrix.python-version == '3.13' && '--group cross-validation' || '' }}
      - name: Fetch surrogate data
        uses: actions/download-artifact@v6
        with:
          name: surrogate-data
          path: surrogate-data
      - name: Install and verify surrogate data
        run: |
          mkdir -p ~/.cache/.JAXNRSur
          cp surrogate-data/*.h5 ~/.cache/.JAXNRSur/
          cd ~/.cache/.JAXNRSur
          md5sum --check --quiet "$GITHUB_WORKSPACE/.github/surrogate-data.md5"
      - name: Give gwsurrogate the surrogate data
        if: matrix.python-version == '3.13'
        run: |
          uv run python - <<'PY'
          import shutil
          from pathlib import Path
          from gwsurrogate.catalog import download_path
          src = Path.home() / ".cache" / ".JAXNRSur"
          dst = Path(download_path())
          dst.mkdir(parents=True, exist_ok=True)
          for f in sorted(src.glob("*.h5")):
              shutil.copy2(f, dst / f.name)
              print(f"copied {f.name} -> {dst}")
          PY
      - name: Run tests
        run: |
          if [[ "${{ matrix.python-version }}" == "3.13" ]]; then
            XVAL=""
            if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/dependency-autoupdate" ]]; then
              XVAL="tests/cross_validation/ --profile ci"
            fi
            uv run pytest --cov=jaxnrsur --cov-report=term-missing tests/unit tests/integration $XVAL
          else
            uv run pytest tests/unit tests/integration
          fi
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.13'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: uv run coveralls

  publish-testpypi:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/jaxnrsur/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Build package
        run: uv build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          skip-existing: true

  publish:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/JAXNRSur/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
