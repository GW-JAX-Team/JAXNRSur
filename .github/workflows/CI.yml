name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group test
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install GSL
        if: matrix.python-version == '3.12'
        run: sudo apt-get install -y libgsl-dev
      - name: Install dependencies
        run: uv sync --group test ${{ matrix.python-version == '3.12' && '--group cross-validation' || '' }}
      - name: Restore surrogate data
        id: surrogate-data
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/.JAXNRSur
          key: surrogate-data-${{ hashFiles('.github/surrogate-data.md5') }}
      - name: Download surrogate data
        if: steps.surrogate-data.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/.JAXNRSur
          cd ~/.cache/.JAXNRSur
          while read -r _ name; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --connect-timeout 30 \
              --speed-limit 1000 --speed-time 60 --output "$name" \
              "https://zenodo.org/records/3348115/files/$name?download=1"
          done < "$GITHUB_WORKSPACE/.github/surrogate-data.md5"
          md5sum --check "$GITHUB_WORKSPACE/.github/surrogate-data.md5"
      - name: Save surrogate data
        if: steps.surrogate-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/.JAXNRSur
          key: ${{ steps.surrogate-data.outputs.cache-primary-key }}
      - name: Give gwsurrogate the surrogate data
        if: matrix.python-version == '3.12'
        run: |
          dir=$(uv run python -c "from gwsurrogate.catalog import download_path; print(download_path())")
          mkdir -p "$dir"
          cp ~/.cache/.JAXNRSur/*.h5 "$dir"
      - name: Run tests
        run: |
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            XVAL=""
            if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/dependency-autoupdate" ]]; then
              XVAL="tests/cross_validation/ --profile ci"
            fi
            uv run pytest --cov=jaxnrsur --cov-report=term-missing tests/unit tests/integration $XVAL
          else
            uv run pytest tests/unit tests/integration
          fi
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: uv run coveralls

  publish-testpypi:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/jaxnrsur/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build package
        run: uv build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          skip-existing: true

  publish:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/JAXNRSur/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
