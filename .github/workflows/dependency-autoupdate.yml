name: Scheduled dependency autoupdate

on:
  schedule:
    - cron: "0 6 * * 1"  # 7am CET (UTC+1, winter) / 8am CEST (UTC+2, summer)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: pip install pre-commit
      - run: pre-commit autoupdate
      - run: uv lock --upgrade
      - name: Open or update a PR with hook/lockfile updates
        id: commit_update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "All hooks and dependencies up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .pre-commit-config.yaml uv.lock
          git commit -m "[pre-commit] autoupdate hooks and lock file"
          git push --force origin HEAD:dependency-autoupdate
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dependency-autoupdate --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head dependency-autoupdate \
              --title "[pre-commit] autoupdate hooks and lock file" \
              --body "Automated weekly update of pre-commit hooks and the uv lockfile. Please review and merge."
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger CI on dependency-autoupdate
        if: success() && steps.commit_update.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run CI.yml --ref dependency-autoupdate
