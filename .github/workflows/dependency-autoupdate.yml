name: Scheduled dependency autoupdate

on:
  schedule:
    - cron: "0 6 * * 1"  # 7am CET (UTC+1, winter) / 8am CEST (UTC+2, summer)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.AUTOMATION_APP_ID }}  # secret holds the App's Client ID (Iv23...)
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uvx pre-commit autoupdate
      - run: uv lock --upgrade
      - name: Open or update a PR with hook/lockfile updates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "All hooks and dependencies up to date"
            exit 0
          fi
          git config user.name "gw-jax-team-automation[bot]"
          git config user.email "326235018+gw-jax-team-automation[bot]@users.noreply.github.com"
          git add .pre-commit-config.yaml uv.lock
          git commit -m "[pre-commit] autoupdate hooks and lock file"
          # persist-credentials is off; authenticate this one push with the App token
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force origin HEAD:dependency-autoupdate
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dependency-autoupdate --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head dependency-autoupdate \
              --title "[pre-commit] autoupdate hooks and lock file" \
              --body "Automated weekly update of pre-commit hooks and the uv lockfile. Please review and merge."
          fi
